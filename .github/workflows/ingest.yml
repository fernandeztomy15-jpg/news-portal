name: Ingesta de noticias

on:
  schedule:
    # 11:00 UTC = 08:00 ART (Argentina no tiene horario de verano
    # desde 2009, así que este offset es fijo todo el año).
    - cron: "0 11 * * *"
    # 21:00 UTC = 18:00 ART
    - cron: "0 21 * * *"
  workflow_dispatch: {} # para poder correrlo manualmente y testear

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: npm run curate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
